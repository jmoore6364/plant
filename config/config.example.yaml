# Example configuration file for System Health Analyzer
# Copy this to config.yaml and customize for your environment

# Environment-specific configurations
default:
  environment: development
  debug: true

  # Database configuration
  database:
    url: "sqlite+aiosqlite:///./data/system_health.db"
    pool_size: 10
    max_overflow: 20
    pool_timeout: 30
    echo: false

  # AI service configuration
  ai:
    provider: "anthropic"  # or "openai"
    # Use ${secret:ai/anthropic_api_key} to load from secrets manager
    anthropic_api_key: "${secret:ai/anthropic_api_key}"
    openai_api_key: "${secret:ai/openai_api_key}"
    model: "claude-3-sonnet-20240229"
    max_tokens: 4096
    temperature: 0.7
    timeout: 120

  # API server configuration
  api:
    host: "0.0.0.0"
    port: 8000
    workers: 4
    reload: true
    cors_origins:
      - "*"
    request_timeout: 300

  # Logging configuration
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "logs/app.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5

  # Notification services
  notifications:
    slack:
      enabled: true
      webhook_url: "${secret:notifications/slack/webhook_url}"
      token: "${secret:notifications/slack/token}"
      channel: "#alerts"
      username: "System Health Bot"

    discord:
      enabled: false
      webhook_url: "${secret:notifications/discord/webhook_url}"
      username: "System Health Bot"

    email:
      enabled: false
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      smtp_user: "${secret:notifications/email/user}"
      smtp_password: "${secret:notifications/email/password}"
      from_address: "alerts@example.com"
      to_addresses:
        - "ops@example.com"
      use_tls: true

    pagerduty:
      enabled: false
      api_key: "${secret:notifications/pagerduty/api_key}"
      integration_key: "${secret:notifications/pagerduty/integration_key}"

    deduplication_window_minutes: 30

  # GitHub integration
  github:
    token: "${secret:github/token}"
    repo: "username/repository"
    default_branch: "main"
    create_prs: true
    auto_merge: false

  # Cache configuration
  cache:
    enabled: true
    redis_url: "redis://localhost:6379/0"
    ttl_seconds: 300
    max_connections: 10

  # Security settings
  security:
    jwt_secret_key: "${secret:security/jwt_secret_key}"
    jwt_algorithm: "HS256"
    jwt_expiration_minutes: 1440  # 1 day
    api_keys_enabled: true
    rate_limit_enabled: true
    rate_limit_requests: 100
    rate_limit_period_seconds: 60
    cors_enabled: true
    allowed_hosts:
      - "*"

  # Monitoring
  monitoring:
    metrics_enabled: true
    prometheus_enabled: false
    prometheus_port: 9090
    tracing_enabled: false

  # Data retention
  retention:
    metrics_days: 30
    alerts_days: 90
    diagnoses_days: 180
    fixes_days: 180
    prs_days: 365
    auto_cleanup_enabled: true
    cleanup_schedule_cron: "0 2 * * *"  # 2 AM daily

  # Feature flags
  feature_flags:
    ai_analysis: true
    auto_fix: false
    auto_pr: false
    notifications: true
    database: true
    cache: true
    monitoring: false

# Development environment
development:
  environment: development
  debug: true

  database:
    url: "sqlite+aiosqlite:///./data/dev.db"
    echo: true

  api:
    reload: true
    workers: 1

  logging:
    level: "DEBUG"

  feature_flags:
    ai_analysis: true
    auto_fix: false
    auto_pr: false

# Staging environment
staging:
  environment: staging
  debug: false

  database:
    url: "${secret:database/staging_url}"
    pool_size: 20
    max_overflow: 40

  api:
    host: "0.0.0.0"
    port: 8000
    workers: 8
    reload: false
    cors_origins:
      - "https://staging.example.com"

  logging:
    level: "INFO"
    file: "/var/log/system-health/app.log"

  cache:
    redis_url: "${secret:cache/staging_redis_url}"

  security:
    jwt_secret_key: "${secret:security/staging_jwt_secret}"
    rate_limit_requests: 200
    allowed_hosts:
      - "staging.example.com"

  feature_flags:
    ai_analysis: true
    auto_fix: true
    auto_pr: false
    monitoring: true

# Production environment
production:
  environment: production
  debug: false

  database:
    url: "${secret:database/production_url}"
    pool_size: 50
    max_overflow: 100
    echo: false

  api:
    host: "0.0.0.0"
    port: 8000
    workers: 16
    reload: false
    cors_origins:
      - "https://app.example.com"
    request_timeout: 600

  logging:
    level: "WARNING"
    file: "/var/log/system-health/app.log"

  notifications:
    slack:
      enabled: true
    discord:
      enabled: true
    email:
      enabled: true
    pagerduty:
      enabled: true

  cache:
    enabled: true
    redis_url: "${secret:cache/production_redis_url}"
    max_connections: 50

  security:
    jwt_secret_key: "${secret:security/production_jwt_secret}"
    rate_limit_requests: 500
    rate_limit_period_seconds: 60
    allowed_hosts:
      - "app.example.com"

  monitoring:
    metrics_enabled: true
    prometheus_enabled: true
    tracing_enabled: true

  retention:
    auto_cleanup_enabled: true

  feature_flags:
    ai_analysis: true
    auto_fix: true
    auto_pr: true
    notifications: true
    database: true
    cache: true
    monitoring: true
