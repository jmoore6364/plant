apiVersion: v1
kind: ConfigMap
metadata:
  name: system-health-config
  namespace: default
data:
  config.yaml: |
    environment: production
    debug: false

    database:
      pool_size: 20
      max_overflow: 40

    api:
      host: "0.0.0.0"
      port: 8000
      workers: 4
      reload: false

    logging:
      level: "INFO"
      file: "/app/logs/app.log"

    cache:
      enabled: true
      ttl_seconds: 300

    monitoring:
      metrics_enabled: true
      prometheus_enabled: true

    feature_flags:
      ai_analysis: true
      notifications: true
      database: true
      cache: true
      monitoring: true
---
apiVersion: v1
kind: Secret
metadata:
  name: system-health-secrets
  namespace: default
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://user:password@postgres-service:5432/system_health"
  redis-url: "redis://redis-service:6379/0"
  anthropic-api-key: "your-api-key-here"
  openai-api-key: "your-api-key-here"
  github-token: "your-token-here"
  slack-webhook: "your-webhook-here"
  jwt-secret: "your-jwt-secret-here"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: system-health-data
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: system-health-logs
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: system-health-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - app.example.com
    secretName: system-health-tls
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: system-health-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: system-health-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: system-health-analyzer
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
